      # GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_ENABLED="true"
      # GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_URI="pg-functions://postgres/public/password_verification_attempt"

      # Uncomment to enable common OAuth Variables
      #- 'GOTRUE_EXTERNAL_GITHUB_CLIENT_ID=${GOTRUE_EXTERNAL_GITHUB_CLIENT_ID}'
      #- 'GOTRUE_EXTERNAL_GITHUB_ENABLED=${GOTRUE_EXTERNAL_GITHUB_ENABLED}'
      #- 'GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI=${GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI}'
      #- 'GOTRUE_EXTERNAL_GITHUB_SECRET=${GOTRUE_EXTERNAL_GITHUB_SECRET}'
      #- 'GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID=${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID}'
      #- 'GOTRUE_EXTERNAL_GOOGLE_ENABLED=${GOTRUE_EXTERNAL_GOOGLE_ENABLED}'
      #- 'GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI=${GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI}'
      #- 'GOTRUE_EXTERNAL_GOOGLE_SECRET=${GOTRUE_EXTERNAL_GOOGLE_SECRET}'

  realtime-dev:
    # This container name looks inconsistent but is correct because realtime constructs tenant id by parsing the subdomain
    image: supabase/realtime:v2.148.3
    container_name: realtime-dev.supabase-realtime
    depends_on:
      supabase-db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
      supabase-analytics:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sSfL",
          "--head",
          "-o",
          "/dev/null",
          "-H",
          "Authorization: Bearer ${SERVICE_SUPABASEANON_KEY}",
          "http://127.0.0.1:4000/api/tenants/realtime-dev/health",
        ]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      - PORT=4000
      - DB_HOST=${POSTGRES_HOSTNAME:-supabase-db}
      - DB_PORT=${POSTGRES_PORT:-5432}
      - DB_USER=supabase_admin
      - DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - DB_NAME=${POSTGRES_DB:-postgres}
      - DB_AFTER_CONNECT_QUERY=SET search_path TO _realtime
      - DB_ENC_KEY=${REALTIME_DB_ENC_KEY:-supabaserealtime}
      - API_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - SECRET_KEY_BASE=${SERVICE_PASSWORD_64_REALTIME}
      - METRICS_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - ERL_AFLAGS=-proto_dist inet_tcp
      - DNS_NODES=''
      - RLIMIT_NOFILE=10000
      - APP_NAME=realtime
      - SEED_SELF_HOST=true
      - LOG_LEVEL=error
      - RUN_JANITOR=true
      - JANITOR_INTERVAL=60000
      - DISABLE_HEALTHCHECK_LOGGING=true
    command: >
      sh -c "/app/bin/migrate && /app/bin/realtime eval 'Realtime.Release.seeds(Realtime.Repo)' && /app/bin/server"
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      - RUSTFS_ACCESS_KEY=${SERVICE_USER_MINIO}
      - RUSTFS_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - 'RUSTFS_CORS_ALLOWED_ORIGINS=*'
      - 'RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*'
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://rustfs:9000/health"]
      interval: 2s
      timeout: 10s
      retries: 5
    volumes:
      - rustfs-data:/data

  rustfs-createbucket:
    image: rustfs/rc
    restart: "no"
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
      - 'GLOBAL_S3_BUCKET=${GLOBAL_S3_BUCKET:-stub}'
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        rc alias set supa-rustfs http://rustfs:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
        rc mb --ignore-existing "supa-rustfs/$GLOBAL_S3_BUCKET"

  supabase-storage:
    image: supabase/storage-api:v1.89.12
    depends_on:
      supabase-db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
      supabase-rest:
        condition: service_started
      imgproxy:
        condition: service_started
      rustfs:
        condition: service_healthy
      rustfs-createbucket:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:5000/status",
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      - SERVER_PORT=5000
      - SERVER_REGION=local
      - MULTI_TENANT=false
      - AUTH_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - DATABASE_URL=postgres://supabase_storage_admin:${SERVICE_PASSWORD_POSTGRES}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      - DB_INSTALL_ROLES=false
      - STORAGE_BACKEND=s3
      - 'GLOBAL_S3_BUCKET=${GLOBAL_S3_BUCKET:-stub}'
      - GLOBAL_S3_ENDPOINT=http://rustfs:9000
      - GLOBAL_S3_PROTOCOL=http
      - GLOBAL_S3_FORCE_PATH_STYLE=true
      - STORAGE_S3_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_MINIO}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}
      - UPLOAD_FILE_SIZE_LIMIT=524288000
      - UPLOAD_FILE_SIZE_LIMIT_STANDARD=524288000
      - UPLOAD_SIGNED_URL_EXPIRATION_TIME=120
      - TUS_URL_PATH=/upload/resumable
      - TUS_MAX_SIZE=3600000
      - ENABLE_IMAGE_TRANSFORMATION=true
      - IMGPROXY_URL=http://imgproxy:5001
      - IMGPROXY_REQUEST_TIMEOUT=15
      - DATABASE_SEARCH_PATH=storage
      - NODE_ENV=production
      - REQUEST_ALLOW_X_FORWARDED_PATH=true
      - ANON_KEY=${SERVICE_SUPABASEANON_KEY}
      - SERVICE_KEY=${SERVICE_SUPABASESERVICE_KEY}
      - POSTGREST_URL=http://supabase-rest:3000
      - PGRST_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - STORAGE_PUBLIC_URL=${SERVICE_URL_API_GW}
      - TENANT_ID=${STORAGE_TENANT_ID:-storage-single-tenant}
    volumes:
      - ./volumes/storage:/var/lib/storage
  imgproxy:
    image: darthsim/imgproxy:v4.0.21
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      - IMGPROXY_BIND=:5001
      - IMGPROXY_LOCAL_FILESYSTEM_ROOT=/
      - IMGPROXY_USE_ETAG=true
      - IMGPROXY_AUTO_WEBP=${IMGPROXY_AUTO_WEBP:-true}
      - IMGPROXY_MAX_SRC_RESOLUTION=16.8
    volumes:
      - ./volumes/storage:/var/lib/storage

  supabase-meta:
    image: supabase/postgres-meta:v0.100.0
    depends_on:
      supabase-db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
      supabase-analytics:
        condition: service_healthy
    environment:
      - PG_META_PORT=8080
      - PG_META_DB_HOST=${POSTGRES_HOSTNAME:-supabase-db}
      - PG_META_DB_PORT=${POSTGRES_PORT:-5432}
      - PG_META_DB_NAME=${POSTGRES_DB:-postgres}
      - PG_META_DB_USER=postgres
      - PG_META_DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - CRYPTO_KEY=${SERVICE_PASSWORD_PGMETACRYPTO}

  supabase-edge-functions:
    image: supabase/edge-runtime:v1.77.9
    mem_limit: ${FUNCTIONS_MEMORY_LIMIT:-2g}
    depends_on:
      supabase-analytics:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      - JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - SUPABASE_URL=http://api-gw:8000
      - SUPABASE_PUBLIC_URL=${SERVICE_URL_API_GW}
      - SUPABASE_ANON_KEY=${SERVICE_SUPABASEANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SERVICE_SUPABASESERVICE_KEY}
      - 'SUPABASE_PUBLISHABLE_KEYS={"default":"${SUPABASE_PUBLISHABLE_KEY:-}"}'
      - 'SUPABASE_SECRET_KEYS={"default":"${SUPABASE_SECRET_KEY:-}"}'
      - SUPABASE_DB_URL=postgresql://postgres:${SERVICE_PASSWORD_POSTGRES}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      # TODO: Allow configuring VERIFY_JWT per function.
      - VERIFY_JWT=${FUNCTIONS_VERIFY_JWT:-false}
    volumes:
      - ./volumes/functions:/home/deno/functions
      - deno-cache:/root/.cache/deno
      - type: bind
        source: ./volumes/functions/main/index.ts
        target: /home/deno/functions/main/index.ts
        content: |
          import * as jose from 'https://deno.land/x/jose@v4.14.4/index.ts'
          import { startMemoryPressureLoop } from './memory-pressure.ts'

          console.log('main function started')
          startMemoryPressureLoop()

          const JWT_SECRET = Deno.env.get('JWT_SECRET')
          const SUPABASE_URL = Deno.env.get('SUPABASE_URL')
          const VERIFY_JWT = Deno.env.get('VERIFY_JWT') === 'true'
          const ERROR_CORS_HEADERS = {
            'Access-Control-Allow-Origin': '*',
            'Access-Control-Allow-Headers': 'authorization, x-client-info, apikey, content-type',
            'Access-Control-Allow-Methods': 'GET, POST, PUT, PATCH, DELETE, OPTIONS',
          }

          // Create JWKS for ES256/RS256 tokens (newer tokens)
          let SUPABASE_JWT_KEYS: ReturnType<typeof jose.createRemoteJWKSet> | null = null
          if (SUPABASE_URL) {
            try {
              SUPABASE_JWT_KEYS = jose.createRemoteJWKSet(
                new URL('/auth/v1/.well-known/jwks.json', SUPABASE_URL)
              )
            } catch (e) {
              console.error('Failed to fetch JWKS from SUPABASE_URL:', e)
            }
          }

          function getAuthToken(req: Request) {
            const authHeader = req.headers.get('authorization')
            const sbApiKey = req.headers.get('sb-api-key')
            const bearerToken = authHeader?.match(/^Bearer\s+(.+)$/i)?.[1]
            if (!authHeader && !sbApiKey) {
              throw new Error('Missing authorization header')
            }
            if (bearerToken && !bearerToken.startsWith('sb_')) {
              return bearerToken
            }
            if (sbApiKey) {
              return sbApiKey
            }
            if (bearerToken) {
              return bearerToken
            }
            throw new Error("Auth header is not 'Bearer {token}'")
          }

          async function isValidLegacyJWT(jwt: string): Promise<boolean> {
            if (!JWT_SECRET) {
              console.error('JWT_SECRET not available for HS256 token verification')
              return false
            }

            const encoder = new TextEncoder();
            const secretKey = encoder.encode(JWT_SECRET)

            try {
              await jose.jwtVerify(jwt, secretKey);
            } catch (e) {
              console.error('Symmetric Legacy JWT verification error', e);
              return false;
            }
            return true;
          }

          async function isValidJWT(jwt: string): Promise<boolean> {
            if (!SUPABASE_JWT_KEYS) {
              console.error('JWKS not available for ES256/RS256 token verification')
              return false
            }

            try {
              await jose.jwtVerify(jwt, SUPABASE_JWT_KEYS)
            } catch (e) {
              console.error('Asymmetric JWT verification error', e);
              return false
            }

            return true;
          }

          async function isValidHybridJWT(jwt: string): Promise<boolean> {
            const { alg: jwtAlgorithm } = jose.decodeProtectedHeader(jwt)

            if (jwtAlgorithm === 'HS256') {
              console.log(`Legacy token type detected, attempting ${jwtAlgorithm} verification.`)

              return await isValidLegacyJWT(jwt)
            }

            if (jwtAlgorithm === 'ES256' || jwtAlgorithm === 'RS256') {
              return await isValidJWT(jwt)
            }

            return false;
          }

          Deno.serve(async (req: Request) => {
            if (req.method !== 'OPTIONS' && VERIFY_JWT) {
              try {
                const token = getAuthToken(req)
                const isValidJWT = await isValidHybridJWT(token);

                if (!isValidJWT) {
                  return new Response(JSON.stringify({ msg: 'Invalid JWT' }), {
                    status: 401,
                    headers: { 'Content-Type': 'application/json', ...ERROR_CORS_HEADERS },
                  })
                }
              } catch (e) {
                console.error(e)
                return new Response(JSON.stringify({ msg: e.toString() }), {
                  status: 401,
                  headers: { 'Content-Type': 'application/json', ...ERROR_CORS_HEADERS },
                })
              }
            }

            const url = new URL(req.url)
            const { pathname } = url
            const path_parts = pathname.split('/')
            const service_name = path_parts[1]

            if (!service_name || service_name === '') {
              const error = { msg: 'missing function name in request' }
              return new Response(JSON.stringify(error), {
                status: 400,
                headers: { 'Content-Type': 'application/json', ...ERROR_CORS_HEADERS },
              })
            }

            const servicePath = `/home/deno/functions/${service_name}`
            console.error(`serving the request with ${servicePath}`)

            const memoryLimitMb = 256
            const workerTimeoutMs = 400_000
            const requestAbsentTimeoutMs = 60_000
            const noModuleCache = false
            const importMapPath = null
            const envVarsObj = Deno.env.toObject()
            const envVars = Object.keys(envVarsObj).map((k) => [k, envVarsObj[k]])

            try {
              const worker = await EdgeRuntime.userWorkers.create({
                servicePath,
                memoryLimitMb,
                workerTimeoutMs,
                context: { supervisor: { requestAbsentTimeoutMs } },
                noModuleCache,
                importMapPath,
                envVars,
              })
              const userRequest = new Request(req)
              userRequest.headers.delete('sb-api-key')
              return await worker.fetch(userRequest)
            } catch (e) {
              const error = { msg: e.toString() }
              return new Response(JSON.stringify(error), {
                status: 500,
                headers: { 'Content-Type': 'application/json', ...ERROR_CORS_HEADERS },
              })
            }
          })
      - type: bind
        source: ./volumes/functions/main/memory-pressure.ts
        target: /home/deno/functions/main/memory-pressure.ts
        content: |
          const CHECK_INTERVAL_MS = 1_000
          const PRESSURE_THRESHOLD = 0.8
          const CLEANUP_TIMEOUT_MS = 1_000
          const RETRY_INTERVAL_MS = 5_000

          function parseBytes(value: string, minimum: number): number {
            const bytes = Number(value)
            if (!/^\d+$/.test(value) || !Number.isSafeInteger(bytes) || bytes < minimum) {
              throw new Error('Invalid cgroup memory value')
            }
            return bytes
          }

          export function startMemoryPressureLoop(): void {
            let errorReported = false
            let activeReported = false

            const tick = async () => {
              let delay = CHECK_INTERVAL_MS
              try {
                const max = (await Deno.readTextFile('/sys/fs/cgroup/memory.max')).trim()
                if (max === 'max') {
                  console.warn('Memory pressure monitor disabled: a finite memory limit is required')
                  return
                }
                const current = (await Deno.readTextFile('/sys/fs/cgroup/memory.current')).trim()
                const stat = await Deno.readTextFile('/sys/fs/cgroup/memory.stat')
                const limitBytes = parseBytes(max, 1)
                const currentBytes = parseBytes(current, 0)
                const inactiveFileBytes = parseBytes(stat.match(/^inactive_file[ \t]+(\S+)[ \t]*$/m)?.[1] ?? '', 0)
                const workingSetBytes = Math.max(0, currentBytes - inactiveFileBytes)

                if (!activeReported) {
                  console.log(`Memory pressure monitor active (limit ${limitBytes} bytes)`)
                  activeReported = true
                }

                if (workingSetBytes / limitBytes >= PRESSURE_THRESHOLD) {
                  delay = RETRY_INTERVAL_MS
                  const acknowledged = await EdgeRuntime.userWorkers.tryCleanupIdleWorkers(CLEANUP_TIMEOUT_MS)
                  EdgeRuntime.miCollect()
                  if (acknowledged > 0) {
                    console.warn(
                      `Memory pressure: working set ${workingSetBytes} / ${limitBytes} bytes before cleanup; ` +
                        `${acknowledged} worker(s) acknowledged retirement`
                    )
                  }
                }
                errorReported = false
              } catch (error) {
                if (error instanceof Deno.errors.NotFound || error instanceof Deno.errors.PermissionDenied) {
                  console.warn(`Memory pressure monitor disabled: ${error}`)
                  return
                }
                delay = RETRY_INTERVAL_MS
                if (!errorReported) {
                  console.warn(`Memory pressure monitor failed; retrying: ${error}`)
                  errorReported = true
                }
              }
              setTimeout(() => void tick(), delay)
            }

            setTimeout(() => void tick(), CHECK_INTERVAL_MS)
          }
      - type: bind
        source: ./volumes/functions/hello/index.ts
        target: /home/deno/functions/hello/index.ts
        content: |
          // Follow this setup guide to integrate the Deno language server with your editor:
          // https://deno.land/manual/getting_started/setup_your_environment
          // This enables autocomplete, go to definition, etc.

          Deno.serve(async () => {
            return new Response(
              `"Hello from Edge Functions!"`,
              { headers: { "Content-Type": "application/json" } },
            )
          })

          // To invoke:
          // curl 'http://localhost:<API_GW_HTTP_PORT>/functions/v1/hello' \
          //   --header 'Authorization: Bearer <anon/service_role API key>'

    command:
      - start
      - --main-service
      - /home/deno/functions/main

  supabase-supavisor:
    image: 'supabase/supavisor:2.9.13'
    healthcheck:
      test:
        - CMD
        - curl
        - "-sSfL"
        - "-o"
        - /dev/null
        - "http://127.0.0.1:4000/api/health"
      timeout: 5s
      interval: 5s
      retries: 10
      start_period: 30s
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-analytics:
        condition: service_healthy
    environment:
      - POOLER_TENANT_ID=${POOLER_TENANT_ID:-dev_tenant}
      - POOLER_POOL_MODE=transaction
      - POOLER_DEFAULT_POOL_SIZE=${POOLER_DEFAULT_POOL_SIZE:-20}
      - POOLER_MAX_CLIENT_CONN=${POOLER_MAX_CLIENT_CONN:-100}
      - PORT=4000
      - 'POSTGRES_PORT=${POSTGRES_PORT:-5432}'
      - 'POSTGRES_HOST=${POSTGRES_HOSTNAME:-supabase-db}'
      - 'POSTGRES_HOSTNAME=${POSTGRES_HOSTNAME:-supabase-db}'
      - 'POSTGRES_DB=${POSTGRES_DB:-postgres}'
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - 'DATABASE_URL=ecto://supabase_admin:${SERVICE_PASSWORD_POSTGRES}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/_supabase'
      - CLUSTER_POSTGRES=true
      - 'SECRET_KEY_BASE=${SERVICE_PASSWORD_SUPAVISORSECRET}'
      - 'VAULT_ENC_KEY=${SERVICE_PASSWORD_VAULTENC}'
      - 'API_JWT_SECRET=${SERVICE_PASSWORD_JWT}'
      - 'METRICS_JWT_SECRET=${SERVICE_PASSWORD_JWT}'
      - REGION=local
      - 'ERL_AFLAGS=-proto_dist inet_tcp'
      - 'DB_POOL_SIZE=${POOLER_DB_POOL_SIZE:-5}'
      # TLS for downstream connections (fixes Supabase CLI TLS requirement)
      - GLOBAL_DOWNSTREAM_CERT_PATH=/etc/ssl/server.crt
      - GLOBAL_DOWNSTREAM_KEY_PATH=/etc/ssl/server.key
    command:
      - /bin/sh
      - "-c"
      - |
        if [ ! -f /etc/ssl/server.crt ]; then
          openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
            -keyout /etc/ssl/server.key -out /etc/ssl/server.crt \
            -subj "/CN=supabase-pooler"
        fi
        /app/bin/migrate && /app/bin/supavisor eval "$$(cat /etc/pooler/pooler.exs)" && /app/bin/server
    volumes:
      - type: bind
        source: ./volumes/pooler/pooler.exs
        target: /etc/pooler/pooler.exs
        content: |
          {:ok, _} = Application.ensure_all_started(:supavisor)
          {:ok, version} =
              case Supavisor.Repo.query!("select version()") do
              %{rows: [[ver]]} -> Supavisor.Helpers.parse_pg_version(ver)
              _ -> nil
              end
          params = %{
              "external_id" => System.get_env("POOLER_TENANT_ID"),
              "db_host" => System.get_env("POSTGRES_HOST"),
              "db_port" => System.get_env("POSTGRES_PORT") |> String.to_integer(),
              "db_database" => System.get_env("POSTGRES_DB"),
              "require_user" => false,
              "auth_query" => "SELECT * FROM pgbouncer.get_auth($1)",
              "default_max_clients" => System.get_env("POOLER_MAX_CLIENT_CONN"),
              "default_pool_size" => System.get_env("POOLER_DEFAULT_POOL_SIZE"),
              "default_parameter_status" => %{"server_version" => version},
              "users" => [%{
              "db_user" => "pgbouncer",
              "db_password" => System.get_env("POSTGRES_PASSWORD"),
              "mode_type" => System.get_env("POOLER_POOL_MODE"),
              "pool_size" => System.get_env("POOLER_DEFAULT_POOL_SIZE"),
              "is_manager" => true
              }]
          }

          tenant = Supavisor.Tenants.get_tenant_by_external_id(params["external_id"])

          if tenant do
            {:ok, _} = Supavisor.Tenants.update_tenant(tenant, params)
          else
            {:ok, _} = Supavisor.Tenants.create_tenant(params)
          end

volumes:
  supabase-db-data:
  supabase-db-config:
  deno-cache:
  rustfs-data:
