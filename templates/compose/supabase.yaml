# documentation: https://supabase.io
# slogan: The open source Firebase alternative.
# category: backend
# tags: firebase, alternative, open-source
# minversion: 4.0.0-beta.228
# logo: svgs/supabase.svg
# port: 8000

services:
  api-gw:
    container_name: supabase-envoy
    image: envoyproxy/envoy:v1.39.6
    restart: unless-stopped
    networks:
      default:
        aliases:
          - envoy
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      supabase-studio:
        condition: service_healthy
    ports:
      - ${API_GW_HTTP_PORT:-8000}:8000/tcp
    environment:
      - SERVICE_URL_API_GW_8000
      - 'ANON_KEY=${SERVICE_SUPABASEANON_KEY}'
      - 'SERVICE_ROLE_KEY=${SERVICE_SUPABASESERVICE_KEY}'
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      - ANON_KEY_ASYMMETRIC=${ANON_KEY_ASYMMETRIC:-}
      - SERVICE_ROLE_KEY_ASYMMETRIC=${SERVICE_ROLE_KEY_ASYMMETRIC:-}
      - 'SUPABASE_PUBLIC_URL=${SERVICE_URL_API_GW}'
      - 'DASHBOARD_USERNAME=${SERVICE_USER_ADMIN}'
      - 'DASHBOARD_PASSWORD=${SERVICE_PASSWORD_ADMIN}'
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    volumes:
      - type: bind
        source: ./volumes/api/envoy/envoy.yaml
        target: /etc/envoy/envoy.yaml
        content: |
          dynamic_resources:
            cds_config:
              path_config_source:
                path: /etc/envoy/cds.yaml
              resource_api_version: V3
            lds_config:
              path_config_source:
                path: /etc/envoy/lds.yaml
              resource_api_version: V3
          node:
            cluster: supabase_cluster
            id: supabase_node
          admin:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 9901
      - type: bind
        source: ./volumes/api/envoy/cds.yaml
        target: /etc/envoy/cds.yaml
        content: |
          resources:
            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: auth
              connect_timeout: 5s
              type: STRICT_DNS
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: auth
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: supabase-auth
                              port_value: 9999
            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: rest
              connect_timeout: 5s
              type: STRICT_DNS
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: rest
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: supabase-rest
                              port_value: 3000
            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: realtime
              connect_timeout: 5s
              type: STRICT_DNS
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: realtime
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: realtime-dev.supabase-realtime
                              port_value: 4000
            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: storage
              connect_timeout: 5s
              type: STRICT_DNS
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: storage
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: supabase-storage
                              port_value: 5000
            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: functions
              connect_timeout: 5s
              type: STRICT_DNS
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: functions
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: supabase-edge-functions
                              port_value: 9000
            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: meta
              connect_timeout: 5s
              type: STRICT_DNS
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: meta
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: supabase-meta
                              port_value: 8080
            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: studio
              connect_timeout: 5s
              type: STRICT_DNS
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: studio
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: supabase-studio
                              port_value: 3000
      - type: bind
        source: ./volumes/api/envoy/lds.template.yaml
        target: /etc/envoy/lds.template.yaml
        content: |
          resources:
            - '@type': type.googleapis.com/envoy.config.listener.v3.Listener
              name: supabase
              per_connection_buffer_limit_bytes: 32768
              address:
                socket_address:
                  address: 0.0.0.0
                  port_value: 8000
              filter_chains:
                - filters:
                    - name: envoy.filters.network.http_connection_manager
                      typed_config:
                        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                        stat_prefix: ingress_http
                        normalize_path: true
                        merge_slashes: true
                        path_with_escaped_slashes_action: REJECT_REQUEST
                        use_remote_address: true
                        common_http_protocol_options:
                          headers_with_underscores_action: REJECT_REQUEST
                        upgrade_configs:
                          - upgrade_type: websocket
                        access_log:
                          - name: envoy.access_loggers.stdout
                            typed_config:
                              '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                              log_format:
                                text_format_source:
                                  inline_string: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT% - - [%START_TIME(%d/%b/%Y:%H:%M:%S %z)%] \"%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%\" %RESPONSE_CODE% %BYTES_SENT% \"%REQ(REFERER)%\" \"%REQ(USER-AGENT)%\"\n"
                        route_config:
                          name: supabase_route
                          virtual_hosts:
                            - name: supabase_host
                              domains: ["*"]
                              cors:
                                allow_origin_string_match:
                                  - safe_regex:
                                      regex: ".*"
                                allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD,CONNECT,TRACE"
                                allow_headers: "*"
                                expose_headers: "*"
                                max_age: "3600"
                              request_headers_to_add:
                                - header:
                                    key: X-Forwarded-Host
                                    value: "%REQ(:AUTHORITY)%"
                                  append_action: ADD_IF_ABSENT
                                - header:
                                    key: X-Forwarded-Port
                                    value: "%DOWNSTREAM_LOCAL_PORT%"
                                  append_action: ADD_IF_ABSENT
                              routes:
                                - match:
                                    path: /.well-known/oauth-authorization-server/auth/v1
                                  route:
                                    cluster: auth
                                    prefix_rewrite: /.well-known/oauth-authorization-server
                                    timeout: 30s
                                  typed_per_filter_config: &gateway_api_filters
                                    envoy.filters.http.basic_auth:
                                      '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true
                                - name: functions-v1-all
                                  match:
                                    prefix: /functions/v1/
                                  route:
                                    cluster: functions
                                    prefix_rewrite: /
                                    timeout: 410s
                                    idle_timeout: 160s
                                  typed_per_filter_config:
                                    envoy.filters.http.cors:
                                      '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true
                                    envoy.filters.http.basic_auth:
                                      '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true
                                - match:
                                    prefix: /storage/v1/
                                  route:
                                    cluster: storage
                                    prefix_rewrite: /
                                    timeout: 3600s
                                    idle_timeout: 3600s
                                  typed_per_filter_config: *gateway_api_filters
                                - match:
                                    prefix: /auth/v1/
                                  name: auth-v1-protected
                                  route:
                                    cluster: auth
                                    prefix_rewrite: /
                                    timeout: 30s
                                  typed_per_filter_config: *gateway_api_filters
                                - match:
                                    path: /rest/v1/
                                  name: rest-v1-openapi-protected
                                  route:
                                    cluster: rest
                                    prefix_rewrite: /
                                    timeout: 30s
                                  typed_per_filter_config: *gateway_api_filters
                                - match:
                                    prefix: /rest/v1/
                                  name: rest-v1-protected
                                  route:
                                    cluster: rest
                                    prefix_rewrite: /
                                    timeout: 30s
                                  typed_per_filter_config: *gateway_api_filters
                                - match:
                                    prefix: /graphql/v1
                                  name: graphql-v1-protected
                                  route:
                                    cluster: rest
                                    prefix_rewrite: /rpc/graphql
                                    timeout: 30s
                                  typed_per_filter_config: *gateway_api_filters
                                - match:
                                    prefix: /realtime/v1/api/openapi
                                  name: realtime-v1-api-openapi-blocked
                                  direct_response:
                                    status: 403
                                    body:
                                      inline_string: "Access is forbidden."
                                  typed_per_filter_config: *gateway_api_filters
                                - match:
                                    prefix: /realtime/v1/api/tenants
                                  name: realtime-v1-api-tenants-blocked
                                  direct_response:
                                    status: 403
                                    body:
                                      inline_string: "Access is forbidden."
                                  typed_per_filter_config: *gateway_api_filters
                                - match:
                                    prefix: /realtime/v1/api
                                  name: realtime-v1-api-protected
                                  route:
                                    cluster: realtime
                                    prefix_rewrite: /api
                                    timeout: 30s
                                    host_rewrite_literal: realtime-dev.supabase-realtime
                                  typed_per_filter_config: *gateway_api_filters
                                - match:
                                    prefix: /realtime/v1/
                                  name: realtime-v1-ws-protected
                                  route:
                                    cluster: realtime
                                    prefix_rewrite: /socket/
                                    timeout: 30s
                                    host_rewrite_literal: realtime-dev.supabase-realtime
                                  typed_per_filter_config: *gateway_api_filters
                                - match:
                                    prefix: /pg/
                                  name: pg-protected
                                  route:
                                    cluster: meta
                                    prefix_rewrite: /
                                    timeout: 30s
                                  typed_per_filter_config: *gateway_api_filters
                                - match:
                                    prefix: /api/mcp
                                  direct_response:
                                    status: 403
                                    body:
                                      inline_string: "Access is forbidden."
                                  typed_per_filter_config: *gateway_api_filters
                                - match:
                                    prefix: /mcp
                                  direct_response:
                                    status: 403
                                    body:
                                      inline_string: "Access is forbidden."
                                  typed_per_filter_config: *gateway_api_filters
                                - match:
                                    prefix: /
                                  route:
                                    cluster: studio
                                    timeout: 30s
                                    request_headers_to_remove:
                                      - authorization
                        http_filters:
                          - name: envoy.filters.http.cors
                            typed_config:
                              '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                          - name: envoy.filters.http.basic_auth
                            typed_config:
                              '@type': type.googleapis.com/envoy.extensions.filters.http.basic_auth.v3.BasicAuth
                              users:
                                inline_string: '$${DASHBOARD_BASIC_AUTH}'
                          - name: envoy.filters.http.lua
                            typed_config:
                              '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                              inline_code: |
                                local ANON_KEY = "$${ANON_KEY}"
                                local SERVICE_ROLE_KEY = "$${SERVICE_ROLE_KEY}"
                                local PUBLISHABLE_KEY = "$${SUPABASE_PUBLISHABLE_KEY}"
                                local SECRET_KEY = "$${SUPABASE_SECRET_KEY}"
                                local ANON_JWT = "$${ANON_KEY_ASYMMETRIC}"
                                local SERVICE_JWT = "$${SERVICE_ROLE_KEY_ASYMMETRIC}"
                                local TRANSLATION_ENABLED = PUBLISHABLE_KEY ~= "" and SECRET_KEY ~= "" and ANON_JWT ~= "" and SERVICE_JWT ~= ""
                                local protected = {
                                  ["auth-v1-protected"] = true,
                                  ["rest-v1-openapi-protected"] = true,
                                  ["rest-v1-protected"] = true,
                                  ["graphql-v1-protected"] = true,
                                  ["realtime-v1-api-protected"] = true,
                                  ["realtime-v1-ws-protected"] = true,
                                  ["pg-protected"] = true,
                                }

                                local function starts_with(value, prefix)
                                  return value ~= nil and string.sub(value, 1, string.len(prefix)) == prefix
                                end

                                local function query_apikey(path)
                                  if path == nil then return nil end
                                  local query_start = string.find(path, "?", 1, true)
                                  if query_start == nil then return nil end
                                  for key, value in string.gmatch(string.sub(path, query_start + 1), "([^&]+)=([^&]*)") do
                                    if key == "apikey" and value ~= "" then return value end
                                  end
                                  return nil
                                end

                                local function bearer_token(value)
                                  if value == nil then return nil end
                                  return string.match(value, "^[Bb]earer%s+(.+)$")
                                end

                                local function replace_query_apikey(path, new_value)
                                  local query_start = string.find(path, "?", 1, true)
                                  if query_start == nil then return nil end
                                  local query = string.sub(path, query_start + 1)
                                  local parts = {}
                                  local replaced = false
                                  for part in string.gmatch(query, "([^&]+)") do
                                    local key = string.match(part, "([^=]+)=")
                                    if key == "apikey" then
                                      part = "apikey=" .. new_value
                                      replaced = true
                                    end
                                    table.insert(parts, part)
                                  end
                                  if not replaced then return nil end
                                  return string.sub(path, 1, query_start) .. table.concat(parts, "&")
                                end

                                local function translate(key)
                                  if TRANSLATION_ENABLED and key == SECRET_KEY then return SERVICE_JWT end
                                  if TRANSLATION_ENABLED and key == PUBLISHABLE_KEY then return ANON_JWT end
                                  if key == SERVICE_ROLE_KEY then return SERVICE_ROLE_KEY end
                                  if key == ANON_KEY then return ANON_KEY end
                                  if key == SERVICE_JWT then return SERVICE_JWT end
                                  if key == ANON_JWT then return ANON_JWT end
                                  return nil
                                end

                                local function unauthorized(handle, message)
                                  handle:respond({ [":status"] = "401", ["content-type"] = "text/plain" }, message or "Unauthorized")
                                end

                                local function open_auth_path(path)
                                  local open_paths = {
                                    "/auth/v1/verify", "/auth/v1/callback", "/auth/v1/authorize",
                                    "/auth/v1/.well-known/jwks.json", "/auth/v1/.well-known/oauth-authorization-server",
                                    "/auth/v1/.well-known/openid-configuration", "/auth/v1/sso/saml/acs",
                                    "/auth/v1/sso/saml/metadata",
                                  }
                                  for _, item in ipairs(open_paths) do
                                    if starts_with(path, item) then return true end
                                  end
                                  return false
                                end

                                function envoy_on_request(handle)
                                  local headers = handle:headers()
                                  local route = handle:streamInfo():routeName()
                                  local path = headers:get(":path") or ""
                                  local prefixes = {
                                    { "/auth/v1/", "/auth/v1/" },
                                    { "/rest/v1/", "/rest/v1/" },
                                    { "/graphql/v1", "/graphql/v1" },
                                    { "/realtime/v1/", "/realtime/v1/" },
                                    { "/storage/v1/", "/storage/v1" },
                                    { "/functions/v1/", "/functions/v1/" },
                                    { "/pg/", "/pg/" },
                                    { "/.well-known/oauth-authorization-server/auth/v1", "/.well-known/oauth-authorization-server/auth/v1" },
                                  }
                                  for _, item in ipairs(prefixes) do
                                    if starts_with(path, item[1]) then
                                      headers:replace("X-Forwarded-Prefix", item[2])
                                      break
                                    end
                                  end

                                  if route == "functions-v1-all" then
                                    local key = headers:get("apikey")
                                    local auth = headers:get("authorization")
                                    local bearer = bearer_token(auth)
                                    headers:remove("sb-api-key")
                                    if not TRANSLATION_ENABLED then
                                      if (auth == nil or auth == "") and key ~= nil and key ~= "" then
                                        headers:replace("authorization", "Bearer " .. key)
                                      end
                                      return
                                    end
                                    if (key == nil or key == "") and bearer ~= nil and starts_with(bearer, "sb_") then
                                      key = bearer
                                    end
                                    if bearer ~= nil and starts_with(bearer, "sb_") and key ~= nil and key ~= "" and key ~= bearer then
                                      handle:respond({ [":status"] = "401", ["content-type"] = "text/plain", ["access-control-allow-origin"] = "*" }, "Conflicting API keys")
                                      return
                                    end
                                    if key ~= nil and starts_with(key, "sb_") then
                                      local translated = translate(key)
                                      if translated == nil then
                                        handle:respond({ [":status"] = "401", ["content-type"] = "text/plain", ["access-control-allow-origin"] = "*" }, "Invalid API key")
                                        return
                                      end
                                      headers:replace("sb-api-key", translated)
                                    elseif (auth == nil or auth == "") and key ~= nil and key ~= "" then
                                      headers:replace("authorization", "Bearer " .. key)
                                    end
                                    return
                                  end

                                  if not protected[route] then return end
                                  if route == "auth-v1-protected" and open_auth_path(path) then return end

                                  local header_key = headers:get("apikey")
                                  local query_key = query_apikey(path)
                                  local key = header_key or query_key
                                  if key == nil then key = bearer_token(headers:get("authorization")) end
                                  local translated = translate(key)
                                  if translated == nil then
                                    unauthorized(handle)
                                    return
                                  end
                                  if (route == "pg-protected" or route == "rest-v1-openapi-protected") and translated ~= SERVICE_ROLE_KEY and translated ~= SERVICE_JWT then
                                    unauthorized(handle, "Service role key required")
                                    return
                                  end
                                  headers:replace("apikey", translated)
                                  if header_key == nil and query_key ~= nil then
                                    local rewritten = replace_query_apikey(path, translated)
                                    if rewritten ~= nil then headers:replace(":path", rewritten) end
                                  end
                                  local auth = headers:get("authorization")
                                  if auth == nil or auth == "" or starts_with(auth, "Bearer sb_") then
                                    headers:replace("authorization", "Bearer " .. translated)
                                  end
                                  if route == "realtime-v1-ws-protected" then headers:replace("x-api-key", translated) end
                                end
                          - name: envoy.filters.http.router
                            typed_config:
                              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      - type: bind
        source: ./volumes/api/envoy/docker-entrypoint.sh
        target: /docker-entrypoint.sh
        content: |
          #!/bin/sh
          set -e
          PASSWORD_HASH=$$(printf '%s' "$$DASHBOARD_PASSWORD" | openssl sha1 -binary | openssl base64)
          DASHBOARD_BASIC_AUTH="$${DASHBOARD_USERNAME}:{SHA}$${PASSWORD_HASH}"
          sed -e "s|\$${ANON_KEY}|$${ANON_KEY}|g" \
              -e "s|\$${SERVICE_ROLE_KEY}|$${SERVICE_ROLE_KEY}|g" \
              -e "s|\$${SUPABASE_PUBLISHABLE_KEY}|$${SUPABASE_PUBLISHABLE_KEY}|g" \
              -e "s|\$${SUPABASE_SECRET_KEY}|$${SUPABASE_SECRET_KEY}|g" \
              -e "s|\$${ANON_KEY_ASYMMETRIC}|$${ANON_KEY_ASYMMETRIC}|g" \
              -e "s|\$${SERVICE_ROLE_KEY_ASYMMETRIC}|$${SERVICE_ROLE_KEY_ASYMMETRIC}|g" \
              -e "s|\$${DASHBOARD_BASIC_AUTH}|$${DASHBOARD_BASIC_AUTH}|g" \
              /etc/envoy/lds.template.yaml > /etc/envoy/lds.yaml
          exec envoy -c /etc/envoy/envoy.yaml
  supabase-studio:
    image: supabase/studio:2026.11.02-sha-a05e7ec
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
        ]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    depends_on:
      supabase-analytics:
        condition: service_healthy
    environment:
      - HOSTNAME=0.0.0.0
      - STUDIO_PG_META_URL=http://supabase-meta:8080
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_HOST=${POSTGRES_HOST:-supabase-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER_READ_WRITE=postgres
      - 'PGRST_DB_SCHEMAS=${PGRST_DB_SCHEMAS:-public,graphql_public}'
      - PGRST_DB_MAX_ROWS=${PGRST_DB_MAX_ROWS:-1000}
      - PGRST_DB_EXTRA_SEARCH_PATH=${PGRST_DB_EXTRA_SEARCH_PATH:-public}

      - DEFAULT_ORGANIZATION_NAME=${STUDIO_DEFAULT_ORGANIZATION:-Default Organization}
      - DEFAULT_PROJECT_NAME=${STUDIO_DEFAULT_PROJECT:-Default Project}

      - 'SUPABASE_URL=http://api-gw:8000'
      - SUPABASE_PUBLIC_URL=${SERVICE_URL_API_GW}
      - SUPABASE_ANON_KEY=${SERVICE_SUPABASEANON_KEY}
      - SUPABASE_SERVICE_KEY=${SERVICE_SUPABASESERVICE_KEY}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      - AUTH_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - PG_META_CRYPTO_KEY=${SERVICE_PASSWORD_PGMETACRYPTO}

      - LOGFLARE_API_KEY=${SERVICE_PASSWORD_LOGFLARE}
      - LOGFLARE_PUBLIC_ACCESS_TOKEN=${SERVICE_PASSWORD_LOGFLARE}
      - LOGFLARE_PRIVATE_ACCESS_TOKEN=${SERVICE_PASSWORD_LOGFLAREPRIVATE}
      - LOGFLARE_URL=http://supabase-analytics:4000
      # Next.js client-side environment variables (required for browser access)
      - 'NEXT_PUBLIC_SUPABASE_URL=${SERVICE_URL_API_GW}'
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SERVICE_SUPABASEANON_KEY}
      - NEXT_PUBLIC_ENABLE_LOGS=true
      # Comment to use Big Query backend for analytics
      - NEXT_ANALYTICS_BACKEND_PROVIDER=postgres
      # Uncomment to use Big Query backend for analytics
      # NEXT_ANALYTICS_BACKEND_PROVIDER=bigquery
      - 'OPENAI_API_KEY=${OPENAI_API_KEY}'
      - SNIPPETS_MANAGEMENT_FOLDER=/app/snippets
      - EDGE_FUNCTIONS_MANAGEMENT_FOLDER=/app/edge-functions
    volumes:
      - ./volumes/snippets:/app/snippets
      - ./volumes/functions:/app/edge-functions
  supabase-db:
    image: supabase/postgres:17.6.1.136
    healthcheck:
      test: pg_isready -U postgres -h 127.0.0.1
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      supabase-vector:
        condition: service_healthy
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    environment:
      - POSTGRES_HOST=/var/run/postgresql
      - PGPORT=${POSTGRES_PORT:-5432}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - PGPASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - PGDATABASE=${POSTGRES_DB:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - JWT_EXP=${JWT_EXPIRY:-3600}
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - type: bind
        source: ./volumes/db/realtime.sql
        target: /docker-entrypoint-initdb.d/migrations/99-realtime.sql
        content: |
          \set pguser `echo "$POSTGRES_USER"`

          create schema if not exists _realtime;
          alter schema _realtime owner to :pguser;
      - type: bind
        source: ./volumes/db/_supabase.sql
        target: /docker-entrypoint-initdb.d/migrations/97-_supabase.sql
        content: |
          \set pguser `echo "$POSTGRES_USER"`

          CREATE DATABASE _supabase WITH OWNER :pguser;
      - type: bind
        source: ./volumes/db/pooler.sql
        target: /docker-entrypoint-initdb.d/migrations/99-pooler.sql
        content: |
          \set pguser `echo "$POSTGRES_USER"`
          \c _supabase
          create schema if not exists _supavisor;
          alter schema _supavisor owner to :pguser;
          \c postgres
      - type: bind
        source: ./volumes/db/webhooks.sql
        target: /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
        content: |
          BEGIN;
          -- Create pg_net extension
          CREATE EXTENSION IF NOT EXISTS pg_net SCHEMA extensions;
          -- Create supabase_functions schema
          CREATE SCHEMA supabase_functions AUTHORIZATION supabase_admin;
          GRANT USAGE ON SCHEMA supabase_functions TO postgres, anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON TABLES TO postgres, anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON FUNCTIONS TO postgres, anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON SEQUENCES TO postgres, anon, authenticated, service_role;
          -- supabase_functions.migrations definition
          CREATE TABLE supabase_functions.migrations (
            version text PRIMARY KEY,
            inserted_at timestamptz NOT NULL DEFAULT NOW()
          );
          -- Initial supabase_functions migration
          INSERT INTO supabase_functions.migrations (version) VALUES ('initial');
          -- supabase_functions.hooks definition
          CREATE TABLE supabase_functions.hooks (
            id bigserial PRIMARY KEY,
            hook_table_id integer NOT NULL,
            hook_name text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT NOW(),
            request_id bigint
          );
          CREATE INDEX supabase_functions_hooks_request_id_idx ON supabase_functions.hooks USING btree (request_id);
          CREATE INDEX supabase_functions_hooks_h_table_id_h_name_idx ON supabase_functions.hooks USING btree (hook_table_id, hook_name);
          COMMENT ON TABLE supabase_functions.hooks IS 'Supabase Functions Hooks: Audit trail for triggered hooks.';
          CREATE FUNCTION supabase_functions.http_request()
            RETURNS trigger
            LANGUAGE plpgsql
            AS $function$
            DECLARE
              request_id bigint;
              payload jsonb;
              url text := TG_ARGV[0]::text;
              method text := TG_ARGV[1]::text;
              headers jsonb DEFAULT '{}'::jsonb;
              params jsonb DEFAULT '{}'::jsonb;
              timeout_ms integer DEFAULT 1000;
            BEGIN
              IF url IS NULL OR url = 'null' THEN
                RAISE EXCEPTION 'url argument is missing';
              END IF;

              IF method IS NULL OR method = 'null' THEN
                RAISE EXCEPTION 'method argument is missing';
              END IF;

              IF TG_ARGV[2] IS NULL OR TG_ARGV[2] = 'null' THEN
                headers = '{"Content-Type": "application/json"}'::jsonb;
              ELSE
                headers = TG_ARGV[2]::jsonb;
              END IF;

              IF TG_ARGV[3] IS NULL OR TG_ARGV[3] = 'null' THEN
                params = '{}'::jsonb;
              ELSE
                params = TG_ARGV[3]::jsonb;
              END IF;

              IF TG_ARGV[4] IS NULL OR TG_ARGV[4] = 'null' THEN
                timeout_ms = 1000;
              ELSE
                timeout_ms = TG_ARGV[4]::integer;
              END IF;

              CASE
                WHEN method = 'GET' THEN
                  SELECT http_get INTO request_id FROM net.http_get(
                    url,
                    params,
                    headers,
                    timeout_ms
                  );
                WHEN method = 'POST' THEN
                  payload = jsonb_build_object(
                    'old_record', OLD,
                    'record', NEW,
                    'type', TG_OP,
                    'table', TG_TABLE_NAME,
                    'schema', TG_TABLE_SCHEMA
                  );

                  SELECT http_post INTO request_id FROM net.http_post(
                    url,
                    payload,
                    params,
                    headers,
                    timeout_ms
                  );
                ELSE
                  RAISE EXCEPTION 'method argument % is invalid', method;
              END CASE;

              INSERT INTO supabase_functions.hooks
                (hook_table_id, hook_name, request_id)
              VALUES
                (TG_RELID, TG_NAME, request_id);

              RETURN NEW;
            END
          $function$;
          -- Supabase super admin
          DO
          $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM pg_roles
              WHERE rolname = 'supabase_functions_admin'
            )
            THEN
              CREATE USER supabase_functions_admin NOINHERIT CREATEROLE LOGIN NOREPLICATION;
            END IF;
          END
          $$;
          GRANT ALL PRIVILEGES ON SCHEMA supabase_functions TO supabase_functions_admin;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA supabase_functions TO supabase_functions_admin;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA supabase_functions TO supabase_functions_admin;
          ALTER USER supabase_functions_admin SET search_path = "supabase_functions";
          ALTER table "supabase_functions".migrations OWNER TO supabase_functions_admin;
          ALTER table "supabase_functions".hooks OWNER TO supabase_functions_admin;
          ALTER function "supabase_functions".http_request() OWNER TO supabase_functions_admin;
          GRANT supabase_functions_admin TO postgres;
          GRANT USAGE ON SCHEMA extensions TO supabase_functions_admin;
          -- Remove unused supabase_pg_net_admin role
          DO
          $$
          BEGIN
            IF EXISTS (
              SELECT 1
              FROM pg_roles
              WHERE rolname = 'supabase_pg_net_admin'
            )
            THEN
              REASSIGN OWNED BY supabase_pg_net_admin TO supabase_admin;
              DROP OWNED BY supabase_pg_net_admin;
              DROP ROLE supabase_pg_net_admin;
            END IF;
          END
          $$;
          -- pg_net grants when extension is already enabled
          DO
          $$
          BEGIN
            IF EXISTS (
              SELECT 1
              FROM pg_extension
              WHERE extname = 'pg_net'
            )
            THEN
              GRANT USAGE ON SCHEMA net TO supabase_functions_admin, postgres, anon, authenticated, service_role;
              ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
              ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
              ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
              ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
              REVOKE ALL ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
              REVOKE ALL ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
              GRANT EXECUTE ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            END IF;
          END
          $$;
          -- Event trigger for pg_net
          CREATE OR REPLACE FUNCTION extensions.grant_pg_net_access()
          RETURNS event_trigger
          LANGUAGE plpgsql
          AS $$
          BEGIN
            IF EXISTS (
              SELECT 1
              FROM pg_event_trigger_ddl_commands() AS ev
              JOIN pg_extension AS ext
              ON ev.objid = ext.oid
              WHERE ext.extname = 'pg_net'
            )
            THEN
              GRANT USAGE ON SCHEMA net TO supabase_functions_admin, postgres, anon, authenticated, service_role;
              ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
              ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
              ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
              ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
              REVOKE ALL ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
              REVOKE ALL ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
              GRANT EXECUTE ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            END IF;
          END;
          $$;
          COMMENT ON FUNCTION extensions.grant_pg_net_access IS 'Grants access to pg_net';
          DO
          $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM pg_event_trigger
              WHERE evtname = 'issue_pg_net_access'
            ) THEN
              CREATE EVENT TRIGGER issue_pg_net_access ON ddl_command_end WHEN TAG IN ('CREATE EXTENSION')
              EXECUTE PROCEDURE extensions.grant_pg_net_access();
            END IF;
          END
          $$;
          INSERT INTO supabase_functions.migrations (version) VALUES ('20210809183423_update_grants');
          ALTER function supabase_functions.http_request() SECURITY DEFINER;
          ALTER function supabase_functions.http_request() SET search_path = supabase_functions;
          REVOKE ALL ON FUNCTION supabase_functions.http_request() FROM PUBLIC;
          GRANT EXECUTE ON FUNCTION supabase_functions.http_request() TO postgres, anon, authenticated, service_role;
          COMMIT;
      - type: bind
        source: ./volumes/db/roles.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
        content: |
          -- NOTE: change to your own passwords for production environments
           \set pgpass `echo "$POSTGRES_PASSWORD"`

           ALTER USER authenticator WITH PASSWORD :'pgpass';
           ALTER USER pgbouncer WITH PASSWORD :'pgpass';
           ALTER USER supabase_auth_admin WITH PASSWORD :'pgpass';
           ALTER USER supabase_functions_admin WITH PASSWORD :'pgpass';
           ALTER USER supabase_storage_admin WITH PASSWORD :'pgpass';
      - type: bind
        source: ./volumes/db/jwt.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
        content: |
          \set jwt_exp `echo "$JWT_EXP"`
          \set db_name `echo "${POSTGRES_DB:-postgres}"`

          ALTER DATABASE :db_name SET "app.settings.jwt_exp" TO :'jwt_exp';

      - type: bind
        source: ./volumes/db/logs.sql
        target: /docker-entrypoint-initdb.d/migrations/99-logs.sql
        content: |
          \set pguser `echo "$POSTGRES_USER"`
          \c _supabase
          create schema if not exists _analytics;
          alter schema _analytics owner to :pguser;
          \c postgres
      # Use named volume to persist pgsodium decryption key between restarts
      - supabase-db-config:/etc/postgresql-custom

  supabase-analytics:
    image: supabase/logflare:1.50.15
    healthcheck:
      test: ["CMD", "curl", "http://127.0.0.1:4000/health"]
      timeout: 5s
      interval: 5s
      retries: 10
    depends_on:
      supabase-db:
        condition: service_healthy
    # volumes:
    #   - type: bind
    #     source: ./volumes/gcloud.json
    #     target: /opt/app/rel/logflare/bin/gcloud.json
    #     read_only: true
    environment:
      - LOGFLARE_NODE_HOST=127.0.0.1
      - DB_USERNAME=supabase_admin
      - DB_DATABASE=_supabase
      - DB_HOSTNAME=${POSTGRES_HOSTNAME:-supabase-db}
      - DB_PORT=${POSTGRES_PORT:-5432}
      - DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - DB_SCHEMA=_analytics
      - LOGFLARE_PUBLIC_ACCESS_TOKEN=${SERVICE_PASSWORD_LOGFLARE}
      - LOGFLARE_PRIVATE_ACCESS_TOKEN=${SERVICE_PASSWORD_LOGFLAREPRIVATE}
      - LOGFLARE_SINGLE_TENANT=true
      - LOGFLARE_SUPABASE_MODE=true

      # Comment variables to use Big Query backend for analytics
      - POSTGRES_BACKEND_URL=postgresql://supabase_admin:${SERVICE_PASSWORD_POSTGRES}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/_supabase
      - POSTGRES_BACKEND_SCHEMA=_analytics
      - LOGFLARE_FEATURE_FLAG_OVERRIDE=multibackend=true

      # Uncomment to use Big Query backend for analytics
      # GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID}
      # GOOGLE_PROJECT_NUMBER=${GOOGLE_PROJECT_NUMBER}
  supabase-vector:
    image: timberio/vector:0.53.0-alpine
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://supabase-vector:9001/health",
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    volumes:
      - type: bind
        source: ./volumes/logs/vector.yml
        target: /etc/vector/vector.yml
        read_only: true
        content: |
          api:
            enabled: true
            address: 0.0.0.0:9001

          sources:
            docker_host:
              type: docker_logs
              # Only collect logs of this stack. Other Supabase stacks on the same server have their own Vector.
              include_labels:
                - 'com.docker.compose.project=${COOLIFY_RESOURCE_UUID?COOLIFY_RESOURCE_UUID is required}'
              exclude_containers:
                - supabase-vector

          transforms:
            project_logs:
              type: remap
              inputs:
                - docker_host
              source: |-
                .project = "default"
                .event_message = del(.message)
                .appname = del(.container_name)
                del(.container_created_at)
                del(.container_id)
                del(.source_type)
                del(.stream)
                del(.label)
                del(.image)
                del(.host)
                del(.stream)
            router:
              type: route
              inputs:
                - project_logs
              route:
                api_gw: '.appname == "supabase-envoy"'
                auth: 'contains(string!(.appname), "supabase-auth")'
                rest: 'contains(string!(.appname), "supabase-rest")'
                realtime: 'contains(string!(.appname), "realtime-dev")'
                storage: 'contains(string!(.appname), "supabase-storage")'
                functions: 'contains(string!(.appname), "supabase-edge-functions")'
                db: 'contains(string!(.appname), "supabase-db")'
            gateway_logs:
              type: remap
              inputs:
                - router.api_gw
              source: |-
                req, err = parse_nginx_log(.event_message, "combined")
                if err == null {
                    .timestamp = req.timestamp
                    .metadata.request.headers.referer = req.referer
                    .metadata.request.headers.user_agent = req.agent
                    .metadata.request.headers.cf_connecting_ip = req.client
                    .metadata.response.status_code = req.status
                    url, split_err = split(req.request, " ")
                    if split_err == null {
                        .metadata.request.method = url[0]
                        .metadata.request.path = url[1]
                        .metadata.request.protocol = url[2]
                    }
                }
                if err != null {
                  abort
                }
            # Gotrue logs are structured json strings which frontend parses directly. But we keep metadata for consistency.
            auth_logs:
              type: remap
              inputs:
                - router.auth
              source: |-
                parsed, err = parse_json(.event_message)
                if err == null {
                    .metadata.timestamp = parsed.time
                    .metadata = merge!(.metadata, parsed)
                }
            # PostgREST logs are structured so we separate timestamp from message using regex
            rest_logs:
              type: remap
              inputs:
                - router.rest
              source: |-
                parsed, err = parse_regex(.event_message, r'^(?P<time>.*): (?P<msg>.*)$')
                if err == null {
                    .event_message = parsed.msg
                    .timestamp = parse_timestamp!(value: parsed.time, format: "%d/%b/%Y:%H:%M:%S %z")
                    .metadata.host = .project
                }
            # Filter out healthcheck logs from Realtime
            realtime_logs_filtered:
              type: filter
              inputs:
                - router.realtime
              condition: '!contains(string!(.event_message), "/health")'
            # Realtime logs are structured so we parse the severity level using regex (ignore time because it has no date)
            realtime_logs:
              type: remap
              inputs:
                - realtime_logs_filtered
              source: |-
                .metadata.project = del(.project)
                .metadata.external_id = .metadata.project
                parsed, err = parse_regex(.event_message, r'^(?P<time>\d+:\d+:\d+\.\d+) \[(?P<level>\w+)\] (?P<msg>.*)$')
                if err == null {
                    .event_message = parsed.msg
                    .metadata.level = parsed.level
                }
            # Storage logs may contain json objects so we parse them for completeness
            storage_logs:
              type: remap
              inputs:
                - router.storage
              source: |-
                .metadata.project = del(.project)
                .metadata.tenantId = .metadata.project
                parsed, err = parse_json(.event_message)
                if err == null {
                    .event_message = parsed.msg
                    .metadata.level = parsed.level
                    .metadata.timestamp = parsed.time
                    .metadata.context[0].host = parsed.hostname
                    .metadata.context[0].pid = parsed.pid
                }
            # Function logs are unstructured messages on stderr
            functions_logs:
              type: remap
              inputs:
                - router.functions
              source: |-
                .metadata.project_ref = del(.project)
            # Postgres logs some messages to stderr which we map to warning severity level
            db_logs:
              type: remap
              inputs:
                - router.db
              source: |-
                .metadata.host = "db-default"
                .metadata.parsed.timestamp = .timestamp

                parsed, err = parse_regex(.event_message, r'.*(?P<level>INFO|NOTICE|WARNING|ERROR|LOG|FATAL|PANIC?):.*', numeric_groups: true)

                if err != null || parsed == null {
                  .metadata.parsed.error_severity = "info"
                }
                if parsed.level != null {
                 .metadata.parsed.error_severity = parsed.level
                }
                if .metadata.parsed.error_severity == "info" {
                    .metadata.parsed.error_severity = "log"
                }
                .metadata.parsed.error_severity = upcase!(.metadata.parsed.error_severity)

          sinks:
            logflare_auth:
              type: 'http'
              inputs:
                - auth_logs
              encoding:
                codec: 'json'
              method: 'post'
              request:
                retry_max_duration_secs: 30
                retry_initial_backoff_secs: 1
                headers:
                  x-api-key: '${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}'
              uri: 'http://supabase-analytics:4000/api/logs?source_name=gotrue.logs.prod'
            logflare_realtime:
              type: 'http'
              inputs:
                - realtime_logs
              encoding:
                codec: 'json'
              method: 'post'
              request:
                retry_max_duration_secs: 30
                retry_initial_backoff_secs: 1
                headers:
                  x-api-key: '${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}'
              uri: 'http://supabase-analytics:4000/api/logs?source_name=realtime.logs.prod'
            logflare_rest:
              type: 'http'
              inputs:
                - rest_logs
              encoding:
                codec: 'json'
              method: 'post'
              request:
                retry_max_duration_secs: 30
                retry_initial_backoff_secs: 1
                headers:
                  x-api-key: '${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}'
              uri: 'http://supabase-analytics:4000/api/logs?source_name=postgREST.logs.prod'
            logflare_db:
              type: 'http'
              inputs:
                - db_logs
              encoding:
                codec: 'json'
              method: 'post'
              request:
                retry_max_duration_secs: 30
                retry_initial_backoff_secs: 1
                headers:
                  x-api-key: '${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}'
              uri: 'http://supabase-analytics:4000/api/logs?source_name=postgres.logs'
            logflare_functions:
              type: 'http'
              inputs:
                - functions_logs
              encoding:
                codec: 'json'
              method: 'post'
              request:
                retry_max_duration_secs: 30
                retry_initial_backoff_secs: 1
                headers:
                  x-api-key: '${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}'
              uri: 'http://supabase-analytics:4000/api/logs?source_name=deno-relay-logs'
            logflare_storage:
              type: 'http'
              inputs:
                - storage_logs
              encoding:
                codec: 'json'
              method: 'post'
              request:
                retry_max_duration_secs: 30
                retry_initial_backoff_secs: 1
                headers:
                  x-api-key: '${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}'
              uri: 'http://supabase-analytics:4000/api/logs?source_name=storage.logs.prod.2'
            logflare_api_gw:
              type: 'http'
              inputs:
                - gateway_logs
              encoding:
                codec: 'json'
              method: 'post'
              request:
                retry_max_duration_secs: 30
                retry_initial_backoff_secs: 1
                headers:
                  x-api-key: '${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}'
              uri: 'http://supabase-analytics:4000/api/logs?source_name=cloudflare.logs.prod'

      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LOGFLARE_PUBLIC_ACCESS_TOKEN=${SERVICE_PASSWORD_LOGFLARE}
    command: ["--config", "/etc/vector/vector.yml"]

  supabase-rest:
    image: postgrest/postgrest:v14.18
    depends_on:
      supabase-db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
      supabase-analytics:
        condition: service_healthy
    environment:
      - PGRST_DB_URI=postgres://authenticator:${SERVICE_PASSWORD_POSTGRES}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      - 'PGRST_DB_SCHEMAS=${PGRST_DB_SCHEMAS:-public,graphql_public}'
